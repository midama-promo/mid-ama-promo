name: Neon migration branch checks

on:
  push:
    branches:
      - migration/neon-resend-r2
  pull_request:
    branches:
      - migration/neon-resend-r2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-migration-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript validation
        run: bun run lint

      - name: Production frontend build
        run: bun run build
