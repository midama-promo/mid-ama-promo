<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="midAmaBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181215" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0a0a0c" stop-opacity="1" />
      <stop offset="100%" stop-color="#040405" stop-opacity="1" />
    </radialGradient>
  </defs>

  <!-- Base Badge Circle -->
  <circle cx="250" cy="250" r="238" fill="url(#midAmaBgGlow)" stroke="#27272a" stroke-width="2.5" />
  <circle cx="250" cy="250" r="230" stroke="#e52535" stroke-opacity="0.2" stroke-width="1" />

  <!-- TOP ARCS (Symmetrically balanced around X=250) -->
  <!-- Outer White Arc Top -->
  <path
    d="M 92.5 151.5 A 186 186 0 0 1 407.5 151.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="11"
    stroke-linecap="round"
  />
  <!-- Inner Red Arc Top -->
  <path
    d="M 106 160 A 170 170 0 0 1 394 160"
    fill="none"
    stroke="#e52535"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- BOTTOM ARCS (Symmetrically balanced around X=250) -->
  <!-- Inner Red Arc Bottom -->
  <path
    d="M 106 340 A 170 170 0 0 0 394 340"
    fill="none"
    stroke="#e52535"
    stroke-width="4.5"
    stroke-linecap="round"
  />
  <!-- Outer White Arc Bottom -->
  <path
    d="M 92.5 348.5 A 186 186 0 0 0 407.5 348.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="11"
    stroke-linecap="round"
  />

  <!-- CENTER TYPOGRAPHY: Mid-Ama -->
  <text
    x="248"
    y="242"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Outfit', 'Space Grotesk', 'Montserrat', -apple-system, sans-serif"
    font-weight="900"
    font-size="68"
    font-style="italic"
    letter-spacing="-1.5"
  >
    <tspan fill="#ffffff">Mid-</tspan>
    <tspan fill="#e52535">Ama</tspan>
  </text>

  <!-- PROMO ROW (Left Red Bar — P R O M O — Right Red Bar) -->
  <!-- Left Red Accent Bar -->
  <rect x="95" y="295" width="85" height="5" fill="#e52535" rx="2.5" />

  <!-- PROMO in Tracked White Text -->
  <text
    x="250"
    y="298"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#ffffff"
    font-family="'Outfit', 'Space Grotesk', 'Montserrat', sans-serif"
    font-weight="900"
    font-size="19"
    letter-spacing="10"
  >
    PROMO
  </text>

  <!-- Right Red Accent Bar -->
  <rect x="320" y="295" width="85" height="5" fill="#e52535" rx="2.5" />
</svg>
